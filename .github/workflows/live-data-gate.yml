# Observability sentinel, not a merge gate: probes "free endpoint died /
# changed shape" incidents that mock-based regression cannot catch.
# - Only zero-auth sources: Tencent / mootdx(TCP) / Sina. Eastmoney endpoints
#   are deliberately excluded (CI runners are datacenter IPs; do not expose
#   them to the Eastmoney throttle).
# - No secrets required.
name: live-data-gate

on:
  schedule:
    # 01:30 UTC = 09:30 Beijing time, A-share session open; weekdays only.
    - cron: "30 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-data-gate
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  live-smoke:
    name: live data-layer smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mootdx]" pytest
      - name: Run network-marked live smoke (routing-chain gate)
        run: python -m pytest tests/test_data_layer_live_smoke.py -m network -v --no-header -p no:cacheprovider

      # Observability, not a gate: per-capability probes report each provider
      # capability separately, so "mootdx failed → Sina fallback saved the
      # chain" stays green on routing while the mootdx capability failure
      # remains visible here. A non-critical provider's single failure must
      # not fail the whole routing gate — hence continue-on-error.
      - name: Probe individual provider capabilities (reported, non-blocking)
        id: capability-probes
        continue-on-error: true
        run: python -m pytest tests/test_live_capability_probes.py -m network -v --no-header -p no:cacheprovider -s

      - name: Capability probe summary
        if: always()
        run: |
          if [ "${{ steps.capability-probes.outcome }}" = "failure" ]; then
            echo "::warning::Some provider capability probes failed — see the probe step above. Routing gate is unaffected unless the smoke step also failed."
          else
            echo "All provider capability probes passed."
          fi
